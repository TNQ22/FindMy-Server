<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FindMy Server">

  <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FindMy Server">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FindMy Server</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function checkOAuthHashToken() {
      try {
        var hash = window.location.hash;
        if (hash && hash.indexOf("id_token=") !== -1) {
          var params = new URLSearchParams(hash.substring(1));
          var idToken = params.get("id_token");
          if (idToken) {
            if (window.opener) {
              window.opener.postMessage({ type: "GOOGLE_TOKEN", token: idToken }, "*");
              window.close();
            } else {
              window.googleOAuthTokenFromRedirect = idToken;
            }
          }
        }
      } catch (e) {}
    })();

    function googleSignOut() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        try {
          window.google.accounts.id.disableAutoSelect();
        } catch (_) {}
      }
    }

    function triggerGooglePopupLogin(clientId, callback) {
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.initialize({
          client_id: clientId,
          auto_select: false,
          cancel_on_tap_outside: true,
          callback: function(response) {
            if (response && response.credential && callback) {
              callback(response.credential);
            }
          }
        });
      }

      var redirectUri = window.location.origin;
      var scope = "email profile openid";
      var url = "https://accounts.google.com/o/oauth2/v2/auth?" +
        "client_id=" + encodeURIComponent(clientId) +
        "&redirect_uri=" + encodeURIComponent(redirectUri) +
        "&response_type=id_token" +
        "&scope=" + encodeURIComponent(scope) +
        "&nonce=" + Math.random().toString(36).substring(2);

      if (isMobile) {
        window.location.href = url;
        return;
      }

      var width = 500;
      var height = 600;
      var left = (screen.width - width) / 2;
      var top = (screen.height - height) / 2;
      var popup = window.open(url, "GoogleLoginPopup", "width=" + width + ",height=" + height + ",top=" + top + ",left=" + left);

      if (!popup || popup.closed || typeof popup.closed === "undefined") {
        window.location.href = url;
        return;
      }

      var messageListener = function(event) {
        if (event.data && event.data.type === "GOOGLE_TOKEN") {
          window.removeEventListener("message", messageListener);
          if (callback) callback(event.data.token);
        }
      };
      window.addEventListener("message", messageListener);

      var timer = setInterval(function() {
        if (popup.closed) {
          clearInterval(timer);
          window.removeEventListener("message", messageListener);
        } else {
          try {
            var href = popup.location.href;
            if (href && href.indexOf("id_token=") !== -1) {
              clearInterval(timer);
              window.removeEventListener("message", messageListener);
              var params = new URLSearchParams(href.substring(href.indexOf("#") + 1));
              var token = params.get("id_token");
              popup.close();
              if (token && callback) callback(token);
            }
          } catch (_) {}
        }
      }, 500);
    }

    function getWebDeviceLocation(callback) {
      if (!navigator.geolocation) return;
      var options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          if (pos && pos.coords && callback) {
            callback(pos.coords.latitude, pos.coords.longitude);
          }
        },
        function(err) {
          navigator.geolocation.getCurrentPosition(
            function(pos2) {
              if (pos2 && pos2.coords && callback) {
                callback(pos2.coords.latitude, pos2.coords.longitude);
              }
            },
            function(err2) {},
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
          );
        },
        options
      );

      if (window._webGeoWatchId) navigator.geolocation.clearWatch(window._webGeoWatchId);
      window._webGeoWatchId = navigator.geolocation.watchPosition(
        function(pos) {
          if (pos && pos.coords && callback) {
            callback(pos.coords.latitude, pos.coords.longitude);
          }
        },
        function(err) {},
        { enableHighAccuracy: false, timeout: 20000, maximumAge: 10000 }
      );
    }

    function stopWebDeviceLocation() {
      if (window._webGeoWatchId) {
        navigator.geolocation.clearWatch(window._webGeoWatchId);
        window._webGeoWatchId = null;
      }
    }
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
