<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Authentication Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4285f4;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h3>Đăng nhập thành công! Đang hoàn tất...</h3>
  <script>
    try {
      var hash = window.location.hash || window.location.search;
      if (hash && hash.length > 1) {
        var cleanHash = hash.startsWith('#') ? hash.substring(1) : hash.substring(1);
        var params = new URLSearchParams(cleanHash);
        var idToken = params.get('id_token');
        
        if (idToken) {
          if (window.opener) {
            window.opener.postMessage({ type: 'GOOGLE_ID_TOKEN', id_token: idToken }, '*');
          }
          setTimeout(function() {
            window.close();
          }, 300);
        }
      }
    } catch(e) {
      console.error("OAuth callback error:", e);
    }
  </script>
</body>
</html>
