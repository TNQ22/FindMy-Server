name: Build & Push Docker Container

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'endpoint/**'
      - 'macless_haystack/**'
      - 'version'
      - '.github/workflows/build-container.yaml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (default: linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(cat version | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Secret
        id: dockerhub_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
            echo "Docker Hub token detected."
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
            echo "Docker Hub token not found. Pushing to GitHub Packages (ghcr.io) only."
          fi

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub_check.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker Tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # GHCR tags (hoàn toàn tự động không cần config secret)
          TAGS="ghcr.io/${REPO_LOWER}:latest,ghcr.io/${REPO_LOWER}:v${{ env.VERSION }}"
          
          # Docker Hub tags (khi có DOCKERHUB_TOKEN)
          if [ "${{ steps.dockerhub_check.outputs.has_dockerhub }}" = "true" ]; then
            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            if [ -z "$DOCKER_USER" ]; then
              DOCKER_USER="$OWNER_LOWER"
            fi
            TAGS="${TAGS},${DOCKER_USER}/findmy-server:latest,${DOCKER_USER}/findmy-server:v${{ env.VERSION }}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
