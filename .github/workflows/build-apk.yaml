name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'macless_haystack/**'
      - 'version'
      - '.github/workflows/build-apk.yaml'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay trên giao diện GitHub

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(cat version | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building APK for version: $VERSION"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android NDK & SDK Platform 35
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-35" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./macless_haystack
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./macless_haystack
        run: flutter build apk --release --no-tree-shake-icons 2>&1 | tee ../build.log

      - name: Rename APK
        run: |
          mv ./macless_haystack/build/app/outputs/flutter-apk/app-release.apk ./FindMy-Server-v${{ steps.get_version.outputs.VERSION }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindMy-Server-v${{ steps.get_version.outputs.VERSION }}-apk
          path: ./FindMy-Server-v${{ steps.get_version.outputs.VERSION }}.apk

      - name: Create GitHub Release (if tag or push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          files: ./FindMy-Server-v${{ steps.get_version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build.log

